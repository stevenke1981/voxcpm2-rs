[package]
name = "voxcpm2-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "voxcpm2"
path = "src/main.rs"

[features]
default = ["cpu"]
cpu = ["voxcpm2-core/cpu"]
cuda = ["voxcpm2-core/cuda"]
metal = ["voxcpm2-core/metal"]
mkl = ["voxcpm2-core/mkl"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
voxcpm2-core = { path = "../voxcpm2-core", default-features = false }
